plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maodietown.synthcalc'
    compileSdk 34

    defaultConfig {
        applicationId "com.maodietown.synthcalc"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            def ksFile = file("release.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KS_PASS") ?: "maodie2026"
                keyAlias "synthcalc"
                keyPassword System.getenv("KS_PASS") ?: "maodie2026"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (file("release.jks").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
